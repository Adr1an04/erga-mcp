[build-system]
requires = ["hatchling>=1.31,<1.32"]
build-backend = "hatchling.build"

[project]
name = "erga-mcp"
version = "0.1.0"
description = "Organize job applications and tailor LaTeX resumes from the CLI or an MCP client."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Erga MCP contributors" }]
keywords = ["career", "local-first", "mcp", "recruiting", "resume"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
]
dependencies = [
    "cryptography>=50,<51",
    "ddgs>=9,<10",
    "defusedxml>=0.7,<1",
    "h2>=4.4.1,<5",
    "keyring>=25,<26",
    "mcp>=2,<3",
    "pypdf>=6.15,<7",
    "questionary>=2.1,<3",
    "scrapling>=0.4,<0.5",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/Adr1an04/erga-mcp"
Documentation = "https://github.com/Adr1an04/erga-mcp/tree/main/docs"
Issues = "https://github.com/Adr1an04/erga-mcp/issues"
Repository = "https://github.com/Adr1an04/erga-mcp.git"

[project.optional-dependencies]
discord = ["discord.py>=2.6,<3"]
dev = [
    "coverage[toml]>=7.6,<8",
    "hatchling>=1.31,<1.32",
    "mypy>=1.14",
    "pip-audit>=2.9,<3",
    "ruff>=0.9",
    "twine>=6,<7",
    "types-defusedxml>=0.7,<1",
]

[project.scripts]
erga = "erga_mcp.cli:console_main"
erga-tokens = "erga_mcp.cli:tokens_main"
erga-mcp = "erga_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/erga_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["erga_mcp"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
