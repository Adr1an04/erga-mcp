name: CI

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra discord

      - name: Verify optional Discord runtime
        run: uv run python -c "import discord; print(discord.__version__)"

      - name: Verify lock file
        run: uv lock --check

      - name: Audit locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt | uv run pip-audit -r /dev/stdin

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      - name: Check patch whitespace
        run: git diff --check

  test:
    name: ${{ matrix.os-name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: Linux
            python-version: "3.11"
          - os: ubuntu-latest
            os-name: Linux
            python-version: "3.12"
          - os: ubuntu-latest
            os-name: Linux
            python-version: "3.13"
          - os: ubuntu-latest
            os-name: Linux
            python-version: "3.14"
          - os: macos-latest
            os-name: macOS
            python-version: "3.11"
          - os: macos-latest
            os-name: macOS
            python-version: "3.14"
          - os: windows-latest
            os-name: Windows
            python-version: "3.11"
          - os: windows-latest
            os-name: Windows
            python-version: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run test suite
        run: uv run python -m unittest discover -s tests -v

      - name: Smoke-test CLI
        run: uv run erga --help

      - name: Smoke-test MCP over stdio
        run: uv run python -m unittest tests.test_mcp_stdio -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Enforce coverage floor
        run: |
          uv run coverage run -m unittest discover -s tests
          uv run coverage report

  package:
    name: Package
    needs:
      - quality
      - test
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install locked build tools
        run: uv sync --frozen --extra dev

      - name: Build wheel and source archive
        run: uv build --no-build-isolation

      - name: Check package metadata
        run: uv run twine check dist/*

      - name: Test the built wheel
        run: |
          uv venv --python 3.11 .package-test
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uv pip install --python .package-test/bin/python "${wheel_path}"
          .package-test/bin/erga --help
          .package-test/bin/python -c "import erga_mcp; print(erga_mcp.__version__)"
          config_dir=$(mktemp -d)
          .package-test/bin/erga init --config "$config_dir/config.toml"
          ERGA_MCP_CONFIG="$config_dir/config.toml" .package-test/bin/erga-mcp </dev/null

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: erga-mcp-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14
