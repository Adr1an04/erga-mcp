name: Release

on:
  release:
    types:
      - published

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra discord

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match package version v{version}")
          PY

      - name: Run release checks
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run coverage run -m unittest discover -s tests
          uv run coverage report

      - name: Audit locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt | uv run pip-audit -r /dev/stdin

      - name: Build wheel and source archive
        run: uv build --no-build-isolation

      - name: Check package metadata
        run: uv run twine check dist/*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: erga-mcp-${{ github.event.release.tag_name }}
          path: dist/*
          if-no-files-found: error

  attach-github-release:
    name: Attach verified packages to GitHub release
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: erga-mcp-${{ github.event.release.tag_name }}
          path: dist

      - name: Attach packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --repo "${{ github.repository }}" "${{ github.event.release.tag_name }}" dist/* --clobber

  publish-pypi:
    name: Publish to PyPI
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/erga-mcp
    permissions:
      id-token: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: erga-mcp-${{ github.event.release.tag_name }}
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
